<main class="min-h-screen bg-canvas">
  <header class="border-b border-line bg-white px-5 py-4 sm:px-8">
    <div class="mx-auto flex max-w-5xl items-center justify-between">
      <a routerLink="/enrollments" class="font-display font-bold text-ink">Enrollment Manager</a>
      <a routerLink="/enrollments" class="text-sm font-bold text-slate-500">Voltar às matrículas</a>
    </div>
  </header>
  <div class="mx-auto max-w-5xl px-5 py-10 sm:px-8">
    <p class="text-sm font-bold uppercase tracking-[0.18em] text-forest">Operação acadêmica</p>
    <h1 class="mt-3 font-display text-4xl font-bold text-ink">Nova matrícula</h1>
    <section class="panel mt-8">
      <form class="grid gap-6 sm:grid-cols-2" (ngSubmit)="save()" #form="ngForm">
        <label class="field-label"
          >Aluno
          <select
            class="field mt-2"
            name="studentId"
            [(ngModel)]="model.studentId"
            (ngModelChange)="loadFormats()"
            [disabled]="!isStaff"
            required
          >
            <option [ngValue]="0">Selecione o aluno</option>
            <option *ngFor="let item of students" [ngValue]="item.userId">
              {{ item.userName }} · {{ item.registrationNumber }}
            </option>
          </select>
        </label>
        <label class="field-label"
          >Curso
          <select
            class="field mt-2"
            name="courseId"
            [(ngModel)]="model.courseId"
            (ngModelChange)="loadFormats()"
            required
          >
            <option [ngValue]="0">Selecione o curso</option>
            <option *ngFor="let item of courses" [ngValue]="item.id">{{ item.name }}</option>
          </select>
        </label>
        <label class="field-label"
          >Formato de estudo
          <select class="field mt-2" name="formatId" [(ngModel)]="model.formatId" required>
            <option [ngValue]="0">Selecione o formato</option>
            <option *ngFor="let item of formatsForCourse" [ngValue]="item.formatId">
              {{ item.formatName }}
            </option>
          </select>
          <span
            *ngIf="model.studentId && model.courseId && !formatsForCourse.length"
            class="mt-2 block text-xs font-semibold text-coral"
            >Não há formato compatível entre este aluno e este curso.</span
          >
        </label>
        <div class="sm:col-span-2">
          <app-api-errors [errors]="errors"></app-api-errors>
          <div class="mt-4 flex justify-end gap-3 border-t border-line pt-6">
            <a routerLink="/enrollments" class="btn-secondary">Cancelar</a>
            <button
              class="btn-primary"
              [disabled]="form.invalid || loading || !formatsForCourse.length"
            >
              {{ loading ? 'Salvando...' : 'Criar matrícula' }}
            </button>
          </div>
        </div>
      </form>
    </section>
  </div>
</main>
