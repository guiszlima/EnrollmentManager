<main class="min-h-screen bg-canvas px-5 py-10 sm:px-8">
  <div class="mx-auto max-w-md">
    <a routerLink="/login" class="flex items-center gap-3"
      ><span
        class="grid h-10 w-10 place-items-center rounded-xl bg-amber-400 font-display text-xl font-bold text-ink"
        >e</span
      ><span class="font-display text-lg font-bold text-ink">Enrollment Manager</span></a
    >
    <section class="mt-16 rounded-2xl border border-line bg-white p-6 shadow-soft sm:p-8">
      <p class="text-sm font-bold uppercase tracking-[0.18em] text-forest">Acesso</p>
      <h1 class="mt-3 font-display text-3xl font-bold text-ink">
        {{ reset ? 'Defina uma nova senha' : 'Recupere seu acesso' }}
      </h1>
      <p class="mt-3 text-sm leading-6 text-slate-500">
        {{
          reset
            ? 'Use o token enviado para concluir a troca.'
            : 'Enviaremos as instruções para o e-mail cadastrado.'
        }}
      </p>
      <form class="mt-8 space-y-5" (ngSubmit)="submit()" #form="ngForm">
        <label *ngIf="reset" class="block text-sm font-bold text-ink"
          >Token<input
            class="field mt-2"
            name="token"
            [(ngModel)]="token"
            required
            minlength="1" /></label
        ><label *ngIf="!reset" class="block text-sm font-bold text-ink"
          >E-mail<input
            class="field mt-2"
            type="email"
            name="email"
            [(ngModel)]="email"
            required
            email /></label
        ><label *ngIf="reset" class="block text-sm font-bold text-ink"
          >Nova senha<input
            class="field mt-2"
            type="password"
            name="newPassword"
            [(ngModel)]="newPassword"
            required
            minlength="6"
        /></label>
        <p *ngIf="message" class="alert-success">{{ message }}</p>
        <app-api-errors [errors]="errors"></app-api-errors
        ><button class="btn-primary w-full" [disabled]="form.invalid || loading">
          {{ loading ? 'Enviando...' : reset ? 'Redefinir senha' : 'Enviar instruções' }}
        </button>
      </form>
      <a routerLink="/login" class="mt-6 block text-center text-sm font-bold text-forest"
        >Voltar para o login</a
      >
    </section>
  </div>
</main>
