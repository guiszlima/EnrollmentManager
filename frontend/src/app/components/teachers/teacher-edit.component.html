<main class="min-h-screen bg-canvas"><header class="border-b border-line bg-white px-5 py-4 sm:px-8"><div class="mx-auto flex max-w-5xl items-center justify-between"><a routerLink="/teachers" class="font-display font-bold text-ink">Enrollment Manager</a><a routerLink="/teachers" class="text-sm font-bold text-slate-500">Voltar aos professores</a></div></header><div class="mx-auto max-w-5xl px-5 py-8 sm:px-8"><p class="text-sm font-bold uppercase tracking-[0.18em] text-forest">Equipe acadêmica</p><h1 class="mt-2 font-display text-4xl font-bold text-ink">Editar professor</h1><section class="panel mt-6 p-6 sm:p-8"><div class="rounded-xl border border-line bg-slate-50 p-4 text-sm text-slate-600"><strong>{{ userName }}</strong> · {{ email }}</div><form class="mt-6" (ngSubmit)="save()" #form="ngForm"><label class="field-label">Formatos de estudo<select class="field mt-2 min-h-32" name="formatIds" [(ngModel)]="formatIds" multiple required><option *ngFor="let format of formats" [ngValue]="format.id">{{ format.name }}</option></select></label><app-api-errors [errors]="errors"></app-api-errors><div class="mt-6 flex justify-end gap-3 border-t border-line pt-6"><a routerLink="/teachers" class="btn-secondary">Cancelar</a><button class="btn-primary" [disabled]="form.invalid || loading">Salvar alterações</button></div></form></section></div></main>
