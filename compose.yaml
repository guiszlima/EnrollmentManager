services:
  postgres:
    image: postgres:16-alpine
    container_name: enrollment_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  enrollmentmanager.api:
    image: enrollmentmanager.api.dev
    build:
      context: .
      dockerfile: EnrollmentManager.API/Dockerfile # Caminho correto a partir da raiz

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development # Força o modo Dev para ver erros detalhados
      ASPNETCORE_URLS: http://0.0.0
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      DOTNET_USE_POLLING_FILE_WATCHER: "1"

    volumes:
      - .:/src:rw # 'rw' garante permissão de leitura e escrita explícita
      - /src/EnrollmentManager.API/bin/
      - /src/EnrollmentManager.API/obj/
      - dotnet_nuget:/root/.nuget/packages


    depends_on:
      - postgres

volumes:
  postgres_data:
  dotnet_nuget: 
